<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Move VFX Review · Poképixel Arena</title>
    <!-- The stage draws the in-battle move-name callout in the same pixel
         font the match uses (see index.html). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #20242c;
        --panel: #272c36;
        --panel-2: #2f3541;
        --line: rgba(255, 255, 255, 0.12);
        --text: #e8e8e8;
        --muted: rgba(232, 232, 232, 0.6);
        --accent: #e0b030;
        --accent-text: #1a1a1a;
        --danger: #d9534f;
        --mark: #ff8c42;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        line-height: 1.4;
      }
      button { font: inherit; color: inherit; cursor: pointer; }
      input, textarea, select { font: inherit; color: inherit; }
      button:disabled { cursor: default; opacity: 0.5; }

      .app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
      .header {
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
      }
      .header h1 { font-size: 15px; margin: 0; letter-spacing: 1px; text-transform: uppercase; }
      .header .count { color: var(--muted); }
      .header .count strong { color: var(--mark); }
      .header .spacer { flex: 1; }
      .toast { color: var(--accent); }

      .body { display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; min-height: 0; }
      .list-panel, .details { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
      .list-panel { border-right: 1px solid var(--line); }
      .details { border-left: 1px solid var(--line); overflow-y: auto; padding: 14px; gap: 14px; }
      .center { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow-y: auto; padding: 14px; gap: 12px; }
      @media (max-width: 1100px) {
        .body { grid-template-columns: 260px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
        .details { grid-column: 1 / -1; border-left: none; border-top: 1px solid var(--line); max-height: 40vh; }
      }
      @media (max-width: 760px) {
        .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; overflow-y: auto; }
        .list-panel { max-height: 40vh; border-right: none; border-bottom: 1px solid var(--line); }
        .details { max-height: none; }
      }

      .filters { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
      .filters .row { display: flex; gap: 6px; }
      .filters input[type="search"], .filters select, .details select, .controls select {
        width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05); outline: none; min-width: 0;
      }
      .filters input[type="search"]:focus, .details textarea:focus { border-color: var(--accent); }

      .list { overflow-y: auto; flex: 1; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
      .list .empty { color: var(--muted); padding: 12px; text-align: center; }
      .move-row {
        display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto 14px; align-items: center; gap: 8px;
        width: 100%; text-align: left; padding: 6px 8px; border-radius: 6px;
        border: 1px solid transparent; border-left: 3px solid transparent; background: transparent;
      }
      .move-row:hover { background: rgba(255, 255, 255, 0.05); }
      .move-row.selected { background: rgba(224, 176, 48, 0.14); border-color: rgba(224, 176, 48, 0.45); }
      .move-row.marked { border-left-color: var(--mark); }
      .move-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; font-size: 12px; }
      .move-row .meta { font-size: 9px; color: var(--muted); }
      .move-row .flag { color: var(--mark); font-size: 12px; text-align: center; }

      .chip {
        display: inline-block; font-size: 9px; letter-spacing: 0.5px; text-transform: uppercase;
        padding: 2px 5px; border-radius: 3px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.08);
        white-space: nowrap;
      }
      .chip.type { color: #fff; border-color: transparent; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.6); text-align: center; }
      .chip.pack { background: rgba(104, 144, 240, 0.25); border-color: rgba(104, 144, 240, 0.5); }
      .chip.family { background: rgba(96, 160, 64, 0.25); border-color: rgba(96, 160, 64, 0.5); }

      .stage { width: 100%; background: #1a1a1a; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
      .stage canvas { display: block; }

      .controls { display: flex; flex-direction: column; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
      .controls .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .controls .status { color: var(--muted); flex: 1; min-width: 160px; }
      .controls .status.error { color: var(--danger); }
      .controls label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
      .controls label.slider { gap: 8px; }
      .controls label.slider input { width: 140px; }
      .controls .hint { color: var(--muted); font-size: 11px; }
      .controls .hint kbd {
        font: inherit; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: rgba(255, 255, 255, 0.06);
      }

      .btn {
        padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.08);
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.14); }
      .btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 700; }
      .btn.primary:hover:not(:disabled) { background: #f0c040; }
      .btn.danger { border-color: rgba(217, 83, 79, 0.6); color: #f2a19e; }
      .btn.danger:hover:not(:disabled) { background: rgba(217, 83, 79, 0.2); }
      .btn.toggle.active { background: rgba(224, 176, 48, 0.2); border-color: var(--accent); }
      .btn.mark { width: 100%; padding: 10px; font-weight: 700; border: 1px solid var(--mark); background: rgba(255, 140, 66, 0.12); color: var(--mark); }
      .btn.mark.active { background: var(--mark); color: var(--accent-text); }

      .details h2 { font-size: 18px; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
      .details h3 { font-size: 11px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
      .details .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
      .details dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 12px; }
      .details dt { color: var(--muted); }
      .details dd { margin: 0; overflow-wrap: anywhere; }
      .details p { margin: 0; font-size: 12px; color: var(--muted); }
      .details textarea {
        width: 100%; min-height: 96px; resize: vertical; padding: 8px; border-radius: 6px; border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05); outline: none;
      }
      .details .sheet { background: repeating-conic-gradient(#2a2f3a 0 25%, #232831 0 50%) 0 0 / 16px 16px; border-radius: 6px; padding: 6px; overflow-x: auto; }
      .details .sheet img { display: block; max-height: 120px; image-rendering: pixelated; }
      .details .timestamp { font-size: 11px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/review/main.tsx"></script>
  </body>
</html>
