# fly.toml app configuration file generated for poke-clash on 2026-09-09T15:00:15-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pokebets'
primary_region = 'sjc'

[build]
[[mounts]]
  source = 'poke_clash_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
