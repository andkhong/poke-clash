    <!-- Retro pixel font for the in-battle move-name callout (PokemonSprite.ts's
         showMoveLabel), matching the blocky arcade-style lettering used by the
         reference battle-UI style this project is following. Space Mono is the
         app's base UI font (see src/ui/theme.ts's FONT_MONO) — the monospace
         face used by the "Retro Arcade" theme the rest of the app follows. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Matches src/ui/theme.ts's BG — avoids a flash of the browser's
         default white before the first screen mounts and paints its own. -->
    <style>
      /* Pixelify Sans draws 2, 3 and 5 like 8 and S, and a capital C like O, so
         FONT_UI takes its digits and C from Press Start 2P (the same file the
         page already loads), scaled to Pixelify's cap height. */
      @font-face {
        font-family: 'UI Digits';
        src: url(https://fonts.gstatic.com/s/pressstart2p/v16/e3t4euO8T-267oIAQAu6jDQyK3nVivNm4I81.woff2) format('woff2');
        unicode-range: U+0030-0039, U+0043;
        size-adjust: 70%;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        background: #dee6ee;
      }
      /* Pixelify's "fi" ligature draws as an "A" ("You fight" read "You Aght").
         On every element and !important because the `font:` shorthand, used all
         over the landing CSS and inline styles, resets font-feature-settings. */
      *,
      *::before,
      *::after {
        font-feature-settings: 'liga' 0, 'clig' 0 !important;
      }
      /* App-wide focus ring (Hoenn Handheld): an INK outline with a gold
         ACTION halo, visible on both the pale ground and gold buttons. */
      :focus-visible {
        outline: 3px solid #29315a;
        outline-offset: 2px;
        box-shadow: 0 0 0 8px #ffc55a;
      }
    </style>
